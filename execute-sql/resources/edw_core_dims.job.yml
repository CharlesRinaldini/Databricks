# Use https://www.freeformatter.com/cron-expression-generator-quartz.html to figure out cron expressions
resources:
  jobs:
    edw_core_dims_job:
      name: EDW_Core_Dims
      schedule:
        quartz_cron_expression: ${var.core_dims_schedule}
        timezone_id: America/Denver

      email_notifications:
        on_failure:
          - ERDWTeam@groupecolas.com

      tasks:
        - task_key: dim_businessunit
          notebook_task:
            notebook_path: ../src/tran_gold_edw_dim_businessunit.ipynb
            source: WORKSPACE
          job_cluster_key: edw_core_dims_cluster
        - task_key: dim_currencyexchangerate
          notebook_task:
            notebook_path: ../src/tran_gold_edw_dim_currencyexchangerate.ipynb
            source: WORKSPACE
          job_cluster_key: edw_core_dims_cluster
        - task_key: dim_ledgertype
          notebook_task:
            notebook_path: ../src/tran_gold_edw_dim_ledgertype.ipynb
            source: WORKSPACE
          job_cluster_key: edw_core_dims_cluster
        - task_key: dim_objectaccount
          depends_on:
            - task_key: dim_businessunit
          notebook_task:
            notebook_path: ../src/tran_gold_edw_dim_objectaccount.ipynb
            source: WORKSPACE
          job_cluster_key: edw_core_dims_cluster
        - task_key: dim_account
          depends_on:
            - task_key: dim_objectaccount
          notebook_task:
            notebook_path: ../src/tran_gold_edw_dim_account.ipynb
            source: WORKSPACE
          job_cluster_key: edw_core_dims_cluster
        - task_key: dim_usersecurity
          depends_on:
            - task_key: dim_businessunit
          notebook_task:
            notebook_path: ../src/tran_gold_edw_dim_UserSecurity.ipynb
            source: WORKSPACE
          job_cluster_key: edw_core_dims_cluster
        - task_key: masterdatamapping
          depends_on:
            - task_key: dim_usersecurity
          notebook_task:
            notebook_path: ../src/tran_gold_edw_masterDataMapping.ipynb
            source: WORKSPACE
          job_cluster_key: edw_core_dims_cluster

      job_clusters:
        - job_cluster_key: edw_core_dims_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4ps_v6
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*, 4]
            spark_env_vars:
              ENV: ${var.environment}
            azure_attributes:
              first_on_demand: 1
              availability: ON_DEMAND_AZURE
              spot_bid_max_price: -1
            num_workers: 0
            data_security_mode: SINGLE_USER
            custom_tags:
              ResourceClass: SingleNode
