# Use https://www.freeformatter.com/cron-expression-generator-quartz.html to figure out cron expressions
resources:
  jobs:
    edw_facts_job:
      name: EDW_Facts
      schedule:
        quartz_cron_expression: ${var.facts_schedule}
        timezone_id: America/Denver

      email_notifications:
        on_failure:
          - ERDWTeam@groupecolas.com

      tasks:
        - task_key: fact_accountbalancedetail
          notebook_task:
            notebook_path: ../src/tran_gold_edw_fact_accountbalancedetail.ipynb
            source: WORKSPACE
          job_cluster_key: edw_facts_cluster

      job_clusters:
        - job_cluster_key: edw_facts_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4ps_v6
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*, 4]
            spark_env_vars:
              ENV: ${var.environment}
            azure_attributes:
              first_on_demand: 1
              availability: ON_DEMAND_AZURE
              spot_bid_max_price: -1
            num_workers: 0
            data_security_mode: SINGLE_USER
            custom_tags:
              ResourceClass: SingleNode
